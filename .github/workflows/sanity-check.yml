name: sanity-check

on: [push]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip" # Mengaktifkan caching otomatis untuk mempercepat build selanjutnya

      - name: Install Dependencies
        run: pip install -r api/requirements.txt

      - name: AST Syntax Check
        run: |
          python -c "
          import ast
          # Memeriksa sintaks kode pada folder api dan file root utama
          ast.parse(open('api/index.py').read())
          ast.parse(open('api/app.py').read())
          ast.parse(open('api/db.py').read())
          ast.parse(open('api/ai.py').read())
          "
