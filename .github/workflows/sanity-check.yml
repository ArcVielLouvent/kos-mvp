name: sanity-check

on: [push]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip" # Mengaktifkan caching otomatis untuk mempercepat build selanjutnya

            - name: AST Syntax Check
        run: |
          python -c "
          import ast
          ast.parse(open('kos-web/python-api/index.py').read())
          ast.parse(open('kos-web/python-api/app.py').read())
          ast.parse(open('kos-web/python-api/db.py').read())
          ast.parse(open('kos-web/python-api/ai.py').read())
          "


